[project]
name = "cyberfusion-aiagent"
version = "0.1.0"
description = "CyberFusion Solutions AI agent foundation built with CrewAI and AgentStack."
authors = [{ name = "CyberFusion Solutions" }]
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "agentstack==0.3.7",
    "crewai==0.118.0",
    "openai>=1.70,<2.0",
    "chroma-hnswlib==0.7.5",
    "langgraph>=0.6,<1.0",
    "langchain-core>=0.3,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
