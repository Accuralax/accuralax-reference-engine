    title: "MIS Reporting Baseline"
    tags: [mis, report, dashboard, data quality, workflow, records]
    content: "Define reporting purpose, source systems, data owner, refresh frequency, quality checks, access controls, and required outputs before changing information workflows."
  - id: it-security-001
    domain: security
    title: "IT Support Security Baseline"
    tags: [security, password, access, credentials, phishing, incident]
    content: "Never request or store passwords, API keys, tokens, or payment details. Suspected security incidents require controlled escalation and human review."
