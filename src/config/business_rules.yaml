version: 1

safety:
  never_request:
    - passwords
    - api_keys
    - authentication_tokens
    - payment_card_details
  human_review_required:
    - credential_changes
    - irreversible_actions
    - legal_decisions
    - financial_decisions
    - sensitive_data_requests
    - active_security_incidents

intake:
  pipeline:
    - intent
    - client_type
    - service_area
    - knowledge_retrieval
    - response
    - consent_check
    - handoff
    - reference_id
    - audit_event

handoff:
  consent_required: true
  ambiguous_consent_is_not_consent: true
  owner_assignment_required: true

response:
  ask_only_next_missing_field: true
  active_incident_escalation: true
  never_claim_information_is_validated_without_a_verification_step: true
